# SpendScope Supabase configuration.
# Linked project: "SpendScope" (ref bnxqgdsxxakfkcbvkoti, ap-south-1), the database
# SHARED with the Android and iOS apps. The schema is owned by the mobile team:
# do not run `supabase db push` / reset from this repo. See supabase/migrations/README.md.
project_id = "bnxqgdsxxakfkcbvkoti"

[auth]
# Hosted project (dashboard): Site URL https://spend-scope-mu.vercel.app, redirect https://spend-scope-mu.vercel.app/**
# These local values only affect `supabase start` and are not applied to the hosted project.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]

[auth.email]
enable_signup = true
minimum_password_length = 12
